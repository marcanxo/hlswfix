# hlswfix configuration.
#
# Nothing in this file is required. The actual fix, the A2S_INFO challenge that
# HLSW never learned, needs no configuration at all and applies to every server
# you query, Source and GoldSrc alike. Everything below is optional.

# Stop HLSW from reporting to the servers it was built to report to.
#
# Measured, not assumed: HLSW sends a ten byte packet to s9b.hlsw.org, that is
# 62.75.203.63, every five seconds for as long as it runs, and gets nothing
# back. hlsw.net and hlsw.org are still registered and still point at a host,
# they just serve nothing useful today. Whoever holds them next inherits that
# traffic, and nothing HLSW does for you needs it.
#
# At 1 the name lookups are refused, and the address HLSW has already cached
# under HKCU\Software\HLSW\Master Server is refused at the socket as well.
# Blocking the names alone would achieve nothing, because it never has to look
# them up again.
#
# HLSW's own check for a newer HLSW is switched off as well, in HLSW's own
# setting under HKCU\Software\HLSW\Settings, because not placing a call is
# tidier than refusing one. There has been nothing at the other end for years.
# Turning it back on inside HLSW lasts until the next start, since this runs at
# every start.
#
# Set to 0 to leave HLSW's own traffic and its own setting alone.
block_home_calls = 1

# Skip the login screen that a fresh installation shows on startup. It asks for
# an account on servers that stopped answering years ago.
#
# This is HLSW's own setting, so it is switched off in HLSW's own settings:
# LoginOnStartup and AutoLogin under HKCU\Software\HLSW\Management. Turning it
# back on inside HLSW lasts until the next start, because this runs at every
# start; set this to 0 if you want the screen back for good.
skip_login_screen = 1

# Hide the second, redundant answer that a few servers send for one query.
#
# Measured on one of them: the same information twice, once in the format
# GoldSrc used before the Source query protocol existed and once in the modern
# one, fourteen and fifteen milliseconds after the query, without exception.
# HLSW understands both and shows whichever landed last, and the two disagree on
# exactly the fields it reads the game and the version from: the old answer
# carries no application id and calls itself protocol 47 where the modern one
# says 48. The result is a game icon and a version string that flip back and
# forth for as long as that server is selected.
#
# At 1 the old copy is made invisible to HLSW, but only for a server that has
# answered in the modern format within the last ten seconds. A server that
# speaks nothing but the old format is therefore never touched, and one that
# stops sending the modern answer is fully visible again ten seconds later.
#
# Set to 0 to see everything a server sends, exactly as it sends it.
hide_duplicate_info = 1

# Send the links in HLSW's interface somewhere that still answers.
#
# Every one of them points at hlsw.org or hlsw.net, and none of those lead
# anywhere any more. Checked on 2026-08-19: wiki.hlsw.org serves the bare
# Apache default page and answers 404 for every article, the homepage, the
# registration form and the Sentinel lookup answer 403, and nothing under
# hlsw.net answers at all. That is 180 wiki links in cfg\Games.cfg and
# cfg\AddOns.cfg alone, one per game and per server addon, which is why the
# status bar shows a dead address whenever the mouse passes over one.
#
# Deleting them would be the easy answer and the wrong one, because most of
# what they point at still exists. The wiki moved from hlsw.org to hlsw.net
# before it went dark, and the Internet Archive kept the .net copy: of those
# 180 pages, 2 are archived under the .org name and 136 under the .net one. So
# at 1 a wiki link is rewritten to the .net name and handed to the archive,
# and the documentation works again.
#
# Two more rules. "Steam Community" in the right click menu on a player went
# through www.hlsw.org/steamprofile/<id>/, which was HLSW's own redirect to
# Steam and is now a 403; the account id is in the address, so that click goes
# straight to steamcommunity.com instead. And an address that looks up one
# particular server or player, the register link under a server and the
# Sentinel entries, keeps the address it had and fails the way it already did:
# no crawler in 2011 had reason to fetch the page for this server or that
# account, so the archive would answer every one of them with its own "not
# archived" notice, and a link that plainly fails is more honest than one that
# leads to a page explaining it has nothing.
#
# Everything else is handed to the archive under its own address, which shows
# the page as it was.
#
# The status bar is rewritten as well, so what it shows before you click is
# where the click will actually go.
#
# Set to 0 to leave every link exactly as HLSW wrote it, dead ends included.
fix_dead_links = 1

# Look for a newer version of hlswfix when HLSW starts.
#
# This is the one place where the fix does what it stops HLSW from doing, so it
# is worth saying plainly what the difference is. HLSW sends a packet to
# s9b.hlsw.org every five seconds for as long as it runs, gets nothing back,
# cannot be told to stop, and the domain it aims at can change hands. This asks
# api.github.com once per start, for one file, at the same address you
# downloaded this from, sends nothing that identifies you or this machine, and
# is switched off by the line below.
#
# It is on rather than off on purpose. A check nobody switches on tells nobody
# anything, and there is nothing else that would: the version in the title bar
# is read out of the file itself, so it is always right about what is running
# and never about what exists.
#
# When there is something newer you get one dialog with three ways out:
# install it, open the release page, or not now.
#
# Installing downloads the same archive a person would, checks it against the
# SHA-256 that GitHub publishes for it, and takes hlswfix.dll and the launcher
# out of it. Nothing on disk is touched before that has all succeeded, and if a
# step fails afterwards everything is put back as it was. HLSW can stay open
# while it happens; the new version takes over the next time it starts.
#
# It needs no unpacking tool for that, neither its own nor one from Windows:
# those two entries are written into the archive uncompressed, so reading them
# is finding them and copying bytes. The archive is an ordinary zip either way
# and opens in Explorer like any other.
#
# When it is in place, it offers to start HLSW again, because the new version
# only runs from the next start and in practice nobody restarts a program
# because a dialog asked them to. Offered, not done: the other button says
# plainly that the new version starts with HLSW the next time. Choosing to
# restart asks HLSW to close the polite way, so it can save what it has and put
# up a question of its own if it wants to; if that question is answered with
# no, HLSW simply stays open and nothing else happens.
#
# This file is never overwritten, which is exactly why the version is not
# written down in it.
#
# What the check on the download does and does not prove: it catches a file
# that arrived damaged or was interfered with on the way. It cannot catch a
# release published from an account that is no longer in the right hands,
# because the file and its hash come from the same place.
update_check = 1

# Everything hlswfix shows comes in the seventeen languages HLSW itself ships,
# and it follows HLSW's own setting rather than the Windows one. There is
# nothing to configure: change the language in HLSW and the fix follows. See the
# README under "It speaks HLSW's language".

# Write hlswfix.log next to hlsw.exe.
#   0  off
#   1  what was hooked, plus anything that went wrong
#   2  every packet as hex, for when a particular server misbehaves
log = 0

# How often a single server may actually be asked, in milliseconds. 0 turns
# the pacing off entirely and lets HLSW query as fast as it likes.
#
# It likes far too fast. HLSW asks the server it is watching again the moment
# the previous answer lands, which measured at around eighty queries a second
# for each of info, players and rules, and the rules answer alone came back as
# two hundred and fifty datagrams a second. A Source server answers three
# queries a second per address and silently drops the rest, so HLSW's own
# refresh rate is what makes the server it is watching appear to time out.
# ServerAutoUpdateRate in the registry does not govern that loop.
#
# At 1000 the three query kinds together come to three a second, which is
# exactly what a server answers without dropping anything.
#
# The limit allows a run-up. Three queries of a kind may go out back to back
# after a quiet spell, and only then does the rate above apply. Without that,
# clicking a server in the list looked broken: HLSW fires everything it knows at
# a server the moment you select it, twenty packets inside five milliseconds,
# and holding almost all of that back made the server you had just clicked the
# one showing a timeout. The average over any longer stretch is unchanged, which
# is the part the server at the other end cares about.
#
# A held back query is not thrown away. It is kept and sent the moment its
# window opens, usually a fraction of a second later, so HLSW always gets its
# answer. That matters more than it sounds: HLSW asks again only once an answer
# has arrived, and while it waits it sends nothing for about two seconds, so a
# query that is quietly dropped costs it that whole stretch and the server is
# painted as timed out. Every server you are not currently looking at used to
# sit in exactly that state.
#
# The price is the ping shown in the list. HLSW starts its stopwatch when it
# hands the query over, so a query delayed by most of a second is reported as
# most of a second. Both together are not possible, and a wrong number in the
# ping column is a smaller lie than a server shown as unreachable. Set this to
# 0 for honest pings and no delay, and read the paragraph above about what that
# does to the servers you query.
query_interval_ms = 1000

# What HLSW is told about a query that is being held back. It decides what the
# ping column means, which is why it is written down at all.
#
#   1  refuse the send, with the error that means "nothing went out, try again
#      in a moment". HLSW then times only queries that really went out, so the
#      ping column tells the truth, 20 or 30 ms rather than 900.
#
#   0  report it as sent and really send it a fraction of a second later.
#      Nothing is ever refused, but HLSW starts its stopwatch when it hands the
#      query over, so the ping column reads about one interval.
#
# Refusing is the default. It is not free: HLSW writes every refused send into
# its status bar as
#
#   ERROR in CHLSWSocket::SendTo: (10035) A non-blocking socket operation
#   could not be completed immediately
#
# so the footer fills up, and clicking a server in the list can briefly flash a
# timeout for it. Neither breaks anything. The ping is what a server browser is
# read for, and a wrong ping is a wrong answer, while a noisy footer is only
# untidy. Set this to 0 if you weigh that the other way.
#
# Either way, whatever is not paced at all, meaning every query outside Source
# and GoldSrc, always shows its real ping.
#refuse_held_queries = 1

# The version HLSW shows in its title bar.
#
# You do not need this line. Left out, the title shows the version of the fix
# itself, which it reads from its own file, so it is right after every update
# without anyone having to remember. That is why the line is not set here: this
# file is never overwritten by an update, on purpose, so a version written into
# it would go stale the moment you upgrade.
#
# The number is shown at all because the developers' last release was 1.4.0.5 in
# 2011, and a higher one says at a glance that this HLSW has the fix in it and
# that somebody is looking after it again. Only what is displayed changes; HLSW
# builds that title from its own version resource and the resource is untouched.
#
#   title_version = 2.0.0.0     show something of your own
#   title_version =             show HLSW's own version, as it shipped
#
#title_version =

# Optional: send rcon for one server to a local port instead of straight at it.
# Useful when the rcon port is firewalled off and you reach it through an ssh
# tunnel, which is worth doing anyway because Source rcon sends its password in
# clear text.
#
# Only tcp is ever diverted. Queries keep going to the real address, so the
# server still shows its true address in HLSW. Repeat the line for more servers.
#
#   rcon_redirect = <server ip> : <server port> -> <local port>
#
# The address in the example belongs to nobody: 203.0.113.0/24 is reserved for
# documentation by RFC 5737 and is not routed anywhere.
#
#rcon_redirect = 203.0.113.10:27015 -> 27115

# Optional: a command started together with HLSW and shut down again with it.
# Meant for the tunnel that rcon_redirect points at, but any command will do.
#
#tunnel_command = ssh -N -L 27115:127.0.0.1:27015 myserver
