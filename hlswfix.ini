# hlswfix configuration.
#
# Nothing in this file is required. The actual fix, the A2S_INFO challenge that
# HLSW never learned, needs no configuration at all and applies to every server
# you query, Source and GoldSrc alike. Everything below is optional.

# Stop HLSW from reporting to the servers it was built to report to.
#
# Measured, not assumed: HLSW sends a ten byte packet to s9b.hlsw.org, that is
# 62.75.203.63, every five seconds for as long as it runs, and gets nothing
# back. hlsw.net and hlsw.org are still registered and still point at a host,
# they just serve nothing useful today. Whoever holds them next inherits that
# traffic, and nothing HLSW does for you needs it.
#
# At 1 the name lookups are refused, and the address HLSW has already cached
# under HKCU\Software\HLSW\Master Server is refused at the socket as well.
# Blocking the names alone would achieve nothing, because it never has to look
# them up again. Set to 0 to leave HLSW's own traffic alone.
block_home_calls = 1

# Skip the login screen that a fresh installation shows on startup. It asks for
# an account on servers that stopped answering years ago.
#
# This is HLSW's own setting, so it is switched off in HLSW's own settings:
# LoginOnStartup and AutoLogin under HKCU\Software\HLSW\Management. Turning it
# back on inside HLSW lasts until the next start, because this runs at every
# start; set this to 0 if you want the screen back for good.
skip_login_screen = 1

# Hide the second, redundant answer that a few servers send for one query.
#
# Measured on one of them: the same information twice, once in the format
# GoldSrc used before the Source query protocol existed and once in the modern
# one, fourteen and fifteen milliseconds after the query, without exception.
# HLSW understands both and shows whichever landed last, and the two disagree on
# exactly the fields it reads the game and the version from: the old answer
# carries no application id and calls itself protocol 47 where the modern one
# says 48. The result is a game icon and a version string that flip back and
# forth for as long as that server is selected.
#
# At 1 the old copy is made invisible to HLSW, but only for a server that has
# answered in the modern format within the last ten seconds. A server that
# speaks nothing but the old format is therefore never touched, and one that
# stops sending the modern answer is fully visible again ten seconds later.
#
# Set to 0 to see everything a server sends, exactly as it sends it.
hide_duplicate_info = 1

# Write hlswfix.log next to hlsw.exe.
#   0  off
#   1  what was hooked, plus anything that went wrong
#   2  every packet as hex, for when a particular server misbehaves
log = 0

# How often a single server may actually be asked, in milliseconds. 0 turns
# the pacing off entirely and lets HLSW query as fast as it likes.
#
# It likes far too fast. HLSW asks the server it is watching again the moment
# the previous answer lands, which measured at around eighty queries a second
# for each of info, players and rules, and the rules answer alone came back as
# two hundred and fifty datagrams a second. A Source server answers three
# queries a second per address and silently drops the rest, so HLSW's own
# refresh rate is what makes the server it is watching appear to time out.
# ServerAutoUpdateRate in the registry does not govern that loop.
#
# At 1000 the three query kinds together come to three a second, which is
# exactly what a server answers without dropping anything.
#
# A held back query is not thrown away. It is kept and sent the moment its
# window opens, usually a fraction of a second later, so HLSW always gets its
# answer. That matters more than it sounds: HLSW asks again only once an answer
# has arrived, and while it waits it sends nothing for about two seconds, so a
# query that is quietly dropped costs it that whole stretch and the server is
# painted as timed out. Every server you are not currently looking at used to
# sit in exactly that state.
#
# The price is the ping shown in the list. HLSW starts its stopwatch when it
# hands the query over, so a query delayed by most of a second is reported as
# most of a second. Both together are not possible, and a wrong number in the
# ping column is a smaller lie than a server shown as unreachable. Set this to
# 0 for honest pings and no delay, and read the paragraph above about what that
# does to the servers you query.
query_interval_ms = 1000

# Experiment, and the only known way to get an honest ping back.
#
# The ping above is inflated because a delayed query is reported to HLSW as
# sent, so HLSW starts timing it at that moment and the delay lands in the
# number. At 1 the send is refused instead, with the error that means "nothing
# went out, try again in a moment". HLSW then knows no answer is on its way, so
# it cannot sit waiting for one, and whatever it sends next goes out at once and
# is timed honestly.
#
# Whether HLSW takes that well is genuinely unknown: its source is lost, and it
# might retry sensibly, retry in a tight loop, or mark the server as failed. So
# this is off unless you are trying it out. Watch the ping column and, if you
# turn on the packet log, the REFUSE lines and how long HLSW waits after one.
refuse_held_queries = 0

# The version HLSW shows in its title bar.
#
# You do not need this line. Left out, the title shows the version of the fix
# itself, which it reads from its own file, so it is right after every update
# without anyone having to remember. That is why the line is not set here: this
# file is never overwritten by an update, on purpose, so a version written into
# it would go stale the moment you upgrade.
#
# The number is shown at all because the developers' last release was 1.4.0.5 in
# 2011, and a higher one says at a glance that this HLSW has the fix in it and
# that somebody is looking after it again. Only what is displayed changes; HLSW
# builds that title from its own version resource and the resource is untouched.
#
#   title_version = 2.0.0.0     show something of your own
#   title_version =             show HLSW's own version, as it shipped
#
#title_version =

# Optional: send rcon for one server to a local port instead of straight at it.
# Useful when the rcon port is firewalled off and you reach it through an ssh
# tunnel, which is worth doing anyway because Source rcon sends its password in
# clear text.
#
# Only tcp is ever diverted. Queries keep going to the real address, so the
# server still shows its true address in HLSW. Repeat the line for more servers.
#
#   rcon_redirect = <server ip> : <server port> -> <local port>
#
# The address in the example belongs to nobody: 203.0.113.0/24 is reserved for
# documentation by RFC 5737 and is not routed anywhere.
#
#rcon_redirect = 203.0.113.10:27015 -> 27115

# Optional: a command started together with HLSW and shut down again with it.
# Meant for the tunnel that rcon_redirect points at, but any command will do.
#
#tunnel_command = ssh -N -L 27115:127.0.0.1:27015 myserver
